name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */8 * * *'   # Every 8 hours: Community Cloud apps sleep after 12 hours without traffic
  workflow_dispatch:
  pull_request:             # Builds and runs the action on every PR before release

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs the action from this repository: a live test of every change
      - uses: ./
        with:
          app-urls: ${{ secrets.APP_URL }}
