name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */8 * * *'   # Every 8 hours: Community Cloud apps sleep after 12 hours without traffic
  workflow_dispatch:
  pull_request:             # Checks that the action still builds before a release

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the action image
        run: docker build -t streamlit-keep-alive .

      # Runs the action from this repository against the apps listed in the APP_URL secret.
      # Skipped when the secret is not set, so the workflow never fails for that reason.
      - name: Keep apps awake
        if: env.APP_URL != ''
        uses: ./
        with:
          app-urls: ${{ env.APP_URL }}
