name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 7 * * *'   # Every day at 7:00 UTC (9:00 Paris)
  workflow_dispatch:        # Allow manual trigger

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build probe image
        run: docker build -t streamlit-probe .

      - name: Run probe
        run: docker run --rm streamlit-probe "${{ secrets.APP_URL }}"
